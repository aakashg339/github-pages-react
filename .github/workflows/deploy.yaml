name: Test Build Deploy
on:
    push:
        branches:
        - 'main'
    pull_request:
        branches:
        - 'main'
    workflow_dispatch:
jobs:
    test:
        name: Test
        runs-on: ubuntu-slim
        steps:
            - name: Get the source code
              uses: actions/checkout@v7
            - name: Setup node
              uses: actions/setup-node@v7
              with:
                node-version: '24.21.0'
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run test
              run: npm test